; Large CSV uploads (100k+ rows is ~4-5 MB; allow generous headroom).
upload_max_filesize = 100M
post_max_size = 110M

; Queue workers hold at most one chunk in memory; the splitter's duplicate
; set is ~100 bytes/row (≈200 MB at the 2M-row cap).
memory_limit = 512M
max_execution_time = 60

opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128

expose_php = Off
